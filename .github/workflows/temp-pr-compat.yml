name: Temporary PR compatibility check

on:
  push:
    branches:
      - optimize-live-concurrency

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check src/modules/sessions/sessions.repository.js
      - run: node --check src/modules/sessions/sessions.service.js
      - run: node --check load-test/run.js
      - run: npm test
